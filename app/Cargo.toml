[package]
name = "flit"
version = "0.1.0"
edition = "2024"

[dependencies]
tiny-skia = "0.12.0"
tray-icon = "0.25.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader"] }

# tiny-skia is painfully slow unoptimised; the render tests draw thousands of frames.
[profile.test]
opt-level = 2
