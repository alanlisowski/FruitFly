[package]
name = "flit"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
tiny-skia = "0.12.0"
tray-icon = "0.25.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_Graphics_Dwm", "Win32_System_Threading"] }

# tiny-skia is painfully slow unoptimised; the render tests draw thousands of frames.
[profile.test]
opt-level = 2
